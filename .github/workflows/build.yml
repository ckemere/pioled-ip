name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  # Compile the drawing code natively and diff its output against the
  # golden framebuffer dump — catches font/rendering regressions.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build render test
        run: gcc -O2 -Wall -Wextra -Werror -o render-test test/render-test.c
      - name: Compare against golden output
        run: ./render-test | diff - test/expected.txt

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: arm64        # 64-bit Raspberry Pi OS (Pi 3/4/5, Zero 2)
            cc: aarch64-linux-gnu-gcc
            pkg: gcc-aarch64-linux-gnu
          - arch: armhf        # 32-bit Raspberry Pi OS (Pi Zero/1, or 32-bit installs)
            cc: arm-linux-gnueabihf-gcc
            pkg: gcc-arm-linux-gnueabihf
    steps:
      - uses: actions/checkout@v5
      - name: Install cross-compiler
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.pkg }}
      - name: Compile static binary
        run: |
          ${{ matrix.cc }} -O2 -Wall -Wextra -Werror -static \
            -o pioled-ip-${{ matrix.arch }} pioled-ip.c
          file pioled-ip-${{ matrix.arch }}
      - uses: actions/upload-artifact@v6
        with:
          name: pioled-ip-${{ matrix.arch }}
          path: pioled-ip-${{ matrix.arch }}

  # On a version tag (git tag v1.0 && git push --tags), publish a Release
  # with both binaries attached, so imaging machines can just download them.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          merge-multiple: true
      - name: Create release with binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            pioled-ip-arm64 pioled-ip-armhf \
            pioled-ip.service inject-pioled.sh inject-pioled-mac.sh \
            --title "$GITHUB_REF_NAME" --generate-notes

  # Also build ready-to-flash "golden" images: official Raspberry Pi OS Lite
  # with pioled-ip already injected. Download -> inject -> recompress ->
  # upload to the release, all inside one job so no Actions artifact storage
  # is used for the large files (only release assets, which have no quota).
  golden-image:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - arch: arm64
            image_url: https://downloads.raspberrypi.com/raspios_lite_arm64_latest
          - arch: armhf
            image_url: https://downloads.raspberrypi.com/raspios_lite_armhf_latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: pioled-ip-${{ matrix.arch }}
      - name: Download official Raspberry Pi OS Lite image
        run: |
          curl -fsSL -o raspios.img.xz '${{ matrix.image_url }}'
          xz -d raspios.img.xz
      - name: Inject pioled-ip
        run: sudo bash ./inject-pioled.sh raspios.img ./pioled-ip-${{ matrix.arch }}
      - name: Compress, checksum, and Imager metadata
        run: |
          OUT=pioled-raspios-lite-${{ matrix.arch }}.img
          mv raspios.img "$OUT"

          # Detect which first-boot mechanism the OS uses (Bookworm: systemd
          # firstrun, Trixie and later: cloud-init) from the rootfs. Mount
          # read-only with journal replay disabled (ro,noload) and do this
          # BEFORE hashing — a normal ext4 mount writes to the image
          # (superblock, journal), which would invalidate the hash.
          LOOP=$(sudo losetup -fP --show "$OUT"); sudo partx -a "$LOOP" 2>/dev/null || true
          mkdir -p rootmnt && sudo mount -o ro,noload "${LOOP}p2" rootmnt
          if [ -d rootmnt/etc/cloud ]; then INIT=cloudinit; else INIT=systemd; fi
          sudo umount rootmnt && sudo losetup -d "$LOOP"

          # Imager needs the *uncompressed* size and hash for extract
          # verification; the .sha256 asset below is of the compressed
          # download instead, for verifying the file people download.
          EXTRACT_SIZE=$(stat -c%s "$OUT")
          EXTRACT_SHA256=$(sha256sum "$OUT" | cut -d' ' -f1)

          xz -T0 -6 "$OUT"
          sha256sum "$OUT.xz" > "$OUT.xz.sha256"

          jq -n \
            --arg name "Raspberry Pi OS Lite (${{ matrix.arch }}) + pioled-ip" \
            --arg desc "Official Raspberry Pi OS Lite with the PiOLED IP display preinstalled ($GITHUB_REF_NAME)" \
            --arg url "https://github.com/${{ github.repository }}/releases/download/$GITHUB_REF_NAME/$OUT.xz" \
            --arg rd "$(date +%Y-%m-%d)" --arg init "$INIT" \
            --argjson es "$EXTRACT_SIZE" --arg esha "$EXTRACT_SHA256" \
            --argjson ds "$(stat -c%s "$OUT.xz")" \
            '{name:$name, description:$desc, url:$url, release_date:$rd,
              extract_size:$es, extract_sha256:$esha, image_download_size:$ds,
              init_format:$init}' > imager-${{ matrix.arch }}.json
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            pioled-raspios-lite-${{ matrix.arch }}.img.xz \
            pioled-raspios-lite-${{ matrix.arch }}.img.xz.sha256 \
            imager-${{ matrix.arch }}.json

  # Merge the per-arch fragments into one imager.json, so Raspberry Pi
  # Imager can be pointed at the release (Options -> Content Repository ->
  # https://github.com/OWNER/REPO/releases/latest/download/imager.json)
  # and offer these images WITH the OS customisation step.
  imager-repo:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: golden-image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Build and publish imager.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "${{ github.repository }}" -p 'imager-*.json'
          jq -s '{os_list: .}' imager-*.json > imager.json
          gh release upload "$GITHUB_REF_NAME" --repo "${{ github.repository }}" imager.json
          for f in imager-*.json; do
            gh release delete-asset "$GITHUB_REF_NAME" "$f" --repo "${{ github.repository }}" -y
          done
